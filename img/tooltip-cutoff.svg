<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340">
  <!-- background -->
  <rect width="480" height="340" fill="#f0f2f5"/>

  <!-- viewport rectangle (clipping boundary) -->
  <rect x="40" y="20" width="400" height="300" rx="8" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="40" y="20" width="400" height="36" rx="8" fill="#e8eaed" stroke="#d0d0d0" stroke-width="1.5"/>
  <text x="240" y="44" font-family="system-ui,sans-serif" font-size="13" fill="#555" text-anchor="middle" font-weight="600">Dashboard</text>

  <!-- toolbar buttons -->
  <rect x="60" y="76" width="80" height="30" rx="5" fill="#3b82f6"/>
  <text x="100" y="96" font-family="system-ui,sans-serif" font-size="12" fill="#fff" text-anchor="middle">Export</text>

  <rect x="152" y="76" width="80" height="30" rx="5" fill="#3b82f6"/>
  <text x="192" y="96" font-family="system-ui,sans-serif" font-size="12" fill="#fff" text-anchor="middle">Share</text>

  <!-- "Settings" button near right edge — tooltip will overflow -->
  <rect x="350" y="76" width="80" height="30" rx="5" fill="#3b82f6"/>
  <text x="390" y="96" font-family="system-ui,sans-serif" font-size="12" fill="#fff" text-anchor="middle">Settings</text>

  <!-- Tooltip that would be fully visible if repositioned -->
  <!-- ghost / correct position (greyed dashed) -->
  <rect x="285" y="46" width="148" height="28" rx="4" fill="none" stroke="#bbb" stroke-dasharray="4 3" stroke-width="1.5"/>
  <text x="359" y="65" font-family="system-ui,sans-serif" font-size="11" fill="#bbb" text-anchor="middle">Manage preferences</text>

  <!-- actual clipped tooltip overflowing right -->
  <rect x="348" y="46" width="148" height="28" rx="4" fill="#1e293b"/>
  <!-- clip the part outside viewport with a white overlay on the overflow side -->
  <rect x="441" y="44" width="50" height="32" fill="#f0f2f5"/>
  <!-- tooltip text (partially hidden) -->
  <text x="364" y="65" font-family="system-ui,sans-serif" font-size="11" fill="#fff">Manage preferen…</text>

  <!-- red boundary line at viewport right edge -->
  <line x1="440" y1="20" x2="440" y2="320" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="436" y="135" font-family="system-ui,sans-serif" font-size="10" fill="#ef4444" text-anchor="end" transform="rotate(-90,436,135)">viewport edge</text>

  <!-- arrow showing overflow -->
  <line x1="440" y1="60" x2="468" y2="60" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- caption -->
  <rect x="40" y="292" width="400" height="28" rx="0 0 8 8" fill="#fff3cd"/>
  <text x="240" y="311" font-family="system-ui,sans-serif" font-size="11" fill="#856404" text-anchor="middle">⚠  Tooltip positioned without viewport-boundary check — clipped at the right edge</text>
</svg>
