<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340">
  <!-- background -->
  <rect width="480" height="340" fill="#f0f2f5"/>

  <!-- browser chrome hint -->
  <rect x="40" y="20" width="400" height="300" rx="8" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.5"/>

  <!-- title bar of the "app" -->
  <rect x="40" y="20" width="400" height="36" rx="8" fill="#e8eaed" stroke="#d0d0d0" stroke-width="1.5"/>
  <text x="240" y="44" font-family="system-ui,sans-serif" font-size="13" fill="#555" text-anchor="middle" font-weight="600">Login</text>

  <!-- form body -->
  <!-- Label 1 -->
  <text x="80" y="96" font-family="system-ui,sans-serif" font-size="13" fill="#333">Email</text>
  <!-- Input 1 -->
  <rect x="80" y="103" width="320" height="36" rx="5" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="96" y="126" font-family="system-ui,sans-serif" font-size="13" fill="#aaa">user@example.com</text>

  <!-- Label 2 -->
  <text x="80" y="166" font-family="system-ui,sans-serif" font-size="13" fill="#333">Password</text>
  <!-- Input 2 — partially covered by button -->
  <rect x="80" y="173" width="320" height="36" rx="5" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="96" y="196" font-family="system-ui,sans-serif" font-size="13" fill="#aaa">••••••••</text>

  <!-- Submit button — shifted up, overlapping the password field -->
  <rect x="80" y="188" width="140" height="38" rx="5" fill="#3b82f6"/>
  <text x="150" y="213" font-family="system-ui,sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="600">Log in</text>

  <!-- red overlap indicator -->
  <line x1="80" y1="188" x2="220" y2="188" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="228" y="193" font-family="system-ui,sans-serif" font-size="11" fill="#ef4444">← overlap here</text>

  <!-- caption -->
  <rect x="40" y="292" width="400" height="28" rx="0 0 8 8" fill="#fff3cd"/>
  <text x="240" y="311" font-family="system-ui,sans-serif" font-size="11" fill="#856404" text-anchor="middle">⚠  Submit button (z-index issue) covers the Password field at narrow widths</text>
</svg>
